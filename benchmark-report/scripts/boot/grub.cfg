# PATCHED: entry 0 has the bench args. Original: CIDATA/grub.cfg.orig
set timeout=5
set default=0

menuentry "Benchmark (toram, no desktop)" {
    linux  /casper/vmlinuz --- quiet splash toram systemd.unit=multi-user.target
    initrd /casper/initrd
}
menuentry "Try or Install Ubuntu" {
    set gfxpayload=keep
    linux  /casper/vmlinuz --- quiet splash
    initrd /casper/initrd
}
menuentry "Ubuntu (safe graphics)" {
    linux  /casper/vmlinuz nomodeset --- quiet splash
    initrd /casper/initrd
}








































